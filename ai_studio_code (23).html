<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>3D Table Tennis — Pro Championship & Master Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        #03050c;
    --panel:     rgba(9, 13, 26, 0.88);
    --panel-2:   rgba(255,255,255,0.05);
    --panel-hover: rgba(255,255,255,0.12);
    --line:      rgba(255,255,255,0.12);
    --player:    #ff7a3d;
    --ai:        #38bdf8;
    --gold:      #facc15;
    --emerald:   #10b981;
    --purple:    #c084fc;
    --ink:       #f8fafc;
    --ink-dim:   #94a3b8;
    --accent:    #ff7a3d;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{
    width:100%; height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    user-select:none; -webkit-user-select:none;
    touch-action:none; overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
  }
  #game{
    position:fixed; inset:0; display:block; width:100%; height:100%;
    cursor:none; touch-action:none; will-change:transform;
  }

  /* ---------- HUD & SCOREBOARD ---------- */
  #hud{
    position:fixed; top:0; left:0; right:0;
    display:flex; flex-direction:column; align-items:center;
    padding-top:10px; pointer-events:none; z-index:5;
  }
  #scoreboard{
    display:flex; align-items:center; gap:16px;
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:6px 20px; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    box-shadow:0 8px 30px rgba(0,0,0,0.6);
    transition:box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .score-block{ display:flex; align-items:center; gap:10px; }
  .score-block .label{
    font-family:'Orbitron', sans-serif; font-size:11px; font-weight:700;
    letter-spacing:2px; color:var(--ink-dim);
  }
  .score-block.player .label{ color:var(--player); }
  .score-block.ai .label{ color:var(--ai); }
  .digits{
    font-family:'Orbitron', sans-serif; font-weight:900;
    font-size:clamp(26px, 5vw, 36px); line-height:1; min-width:32px; text-align:center;
    color:var(--ink);
  }
  .score-block.player .digits{ color:var(--player); text-shadow:0 0 18px rgba(255,122,61,0.65); }
  .score-block.ai .digits{ color:var(--ai); text-shadow:0 0 18px rgba(56,189,248,0.65); }
  #divider{ color:var(--ink-dim); font-family:'Orbitron', sans-serif; font-size:18px; opacity:0.4; }

  #scoreboard.match-point{ animation:mpPulse 1.2s ease-in-out infinite; border-color:var(--gold); }
  @keyframes mpPulse{
    0%,100%{ box-shadow:0 8px 30px rgba(0,0,0,0.6); }
    50%{ box-shadow:0 8px 30px rgba(0,0,0,0.6), 0 0 24px rgba(250,204,21,0.65); }
  }

  #subRow{
    margin-top:6px; display:flex; align-items:center; gap:8px;
    font-family:'Orbitron', sans-serif; font-size:9.5px; letter-spacing:1.5px;
    color:var(--ink-dim); background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:4px 12px; text-transform:uppercase;
    max-width:92vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #subRow .dot{ opacity:0.35; }
  #subRow b{ color:var(--ink); font-weight:700; }
  #serveWho{ color:var(--player); font-weight:700; }

  #rallyBadge{
    position:fixed; top:88px; font-family:'Orbitron', sans-serif; font-weight:800; font-size:11px;
    letter-spacing:1.5px; color:#38bdf8; background:rgba(15,23,42,0.9); border:1px solid rgba(56,189,248,0.4);
    border-radius:20px; padding:3px 12px; pointer-events:none; z-index:5; opacity:0;
    transition:opacity 0.2s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform:scale(0.85);
  }
  #rallyBadge.visible{ opacity:1; transform:scale(1); }

  #topControls{
    position:fixed; top:12px; right:12px; z-index:6; display:flex; gap:8px;
  }
  .icon-btn{
    width:38px; height:38px; border-radius:50%;
    background:var(--panel); border:1px solid var(--line); color:var(--ink);
    font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:transform 0.1s ease, background 0.15s ease; backdrop-filter:blur(6px);
  }
  .icon-btn:active{ transform:scale(0.90); }
  .icon-btn:hover{ background:var(--panel-hover); }

  /* ---------- SERVE SELECTOR BAR ---------- */
  #serveBarContainer{
    position:fixed; bottom:76px; left:50%; transform:translateX(-50%);
    z-index:7; display:flex; flex-direction:column; align-items:center; gap:8px;
    transition:opacity 0.2s ease, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events:auto;
  }
  #serveBarContainer.hidden{
    opacity:0; pointer-events:none; transform:translate(-50%, 16px);
  }
  #serveBar{
    display:flex; gap:5px; background:var(--panel); border:1px solid var(--line);
    padding:5px; border-radius:30px; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    box-shadow:0 8px 24px rgba(0,0,0,0.6); max-width:95vw; overflow-x:auto;
  }
  .serve-tab{
    font-family:'Orbitron', sans-serif; font-size:9.5px; font-weight:800; letter-spacing:0.8px;
    color:var(--ink-dim); padding:6px 12px; border-radius:20px; cursor:pointer;
    border:1px solid transparent; background:transparent; transition:all 0.15s ease;
    white-space:nowrap;
  }
  .serve-tab:hover{ color:var(--ink); background:rgba(255,255,255,0.06); }
  .serve-tab.active{
    background:linear-gradient(135deg, #ff7a3d, #ea580c);
    color:#fff; box-shadow:0 0 14px rgba(255,122,61,0.55);
  }
  .serve-tab.ghost.active{ background:linear-gradient(135deg, #38bdf8, #0284c7); box-shadow:0 0 14px rgba(56,189,248,0.55); }
  .serve-tab.side.active{ background:linear-gradient(135deg, #c084fc, #9333ea); box-shadow:0 0 14px rgba(192,132,252,0.55); }
  .serve-tab.speed.active{ background:linear-gradient(135deg, #facc15, #ca8a04); color:#000; box-shadow:0 0 14px rgba(250,204,21,0.55); }

  #servePrompt{
    font-family:'Orbitron', sans-serif; font-weight:800; font-size:11px;
    letter-spacing:1.5px; color:#fff; background:rgba(255,122,61,0.25);
    border:1px solid rgba(255,122,61,0.6); border-radius:20px;
    padding:6px 18px; text-transform:uppercase; pointer-events:none;
    box-shadow:0 0 16px rgba(255,122,61,0.4); animation:tossPulse 1.1s ease-in-out infinite alternate;
  }
  @keyframes tossPulse{ from{ opacity:0.85; transform:scale(0.97); } to{ opacity:1; transform:scale(1.03); } }

  #banner{
    position:fixed; top:120px; left:50%; transform:translate(-50%,-6px) scale(0.96);
    font-family:'Orbitron', sans-serif; font-weight:800; font-size:14px;
    letter-spacing:1.5px; color:var(--ink);
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:8px 20px; opacity:0; pointer-events:none; z-index:5; text-align:center;
    backdrop-filter:blur(8px);
  }
  #banner.show{ animation:bannerPop 1.3s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards; }
  #banner.smash{
    font-size:20px; color:#ffb020; letter-spacing:2.5px;
    text-shadow:0 0 24px rgba(255,176,32,0.9);
    border-color:rgba(255,176,32,0.7);
  }
  #banner.spin{
    color:#c084fc; border-color:rgba(192,132,252,0.6);
    text-shadow:0 0 18px rgba(192,132,252,0.8);
  }
  @keyframes bannerPop{
    0%{ opacity:0; transform:translate(-50%,-8px) scale(0.94); }
    15%{ opacity:1; transform:translate(-50%,0) scale(1.03); }
    80%{ opacity:1; transform:translate(-50%,0) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-4px) scale(0.98); }
  }

  #hint{
    position:fixed; left:14px; bottom:14px; z-index:5;
    font-size:11px; color:var(--ink-dim); letter-spacing:0.2px; max-width:56vw;
    background:var(--panel); border:1px solid var(--line);
    padding:6px 12px; border-radius:8px; pointer-events:none; line-height:1.4;
    backdrop-filter:blur(8px);
  }

  /* ---------- MODALS & MENUS ---------- */
  #overlay{
    position:fixed; inset:0; z-index:10; cursor:default;
    display:flex; flex-direction:column; align-items:center;
    background:radial-gradient(ellipse at 50% 25%, rgba(15,23,42,0.97), rgba(3,5,12,0.98));
    text-align:center; padding:24px 16px 36px; overflow-y:auto; -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
  }
  #overlay h1{
    font-family:'Orbitron', sans-serif; font-weight:900;
    font-size:clamp(22px, 5.5vw, 42px); letter-spacing:3px;
    color:var(--ink); margin:2px 0 6px;
    text-shadow:0 0 28px rgba(56,189,248,0.4);
  }
  #overlay h1 .accent{ color:var(--player); text-shadow:0 0 28px rgba(255,122,61,0.55); }
  #overlay p.sub{ color:var(--ink-dim); font-size:13px; line-height:1.45; margin:0 auto 14px; max-width:520px; }

  #overlayBody{ max-width:820px; width:100%; }
  #overlayButtons{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:20px; }

  .mode-switch{
    display:inline-flex; gap:6px; background:rgba(255,255,255,0.06); padding:4px; border-radius:30px;
    border:1px solid var(--line); margin-bottom:12px;
  }
  .mode-tab{
    font-family:'Orbitron', sans-serif; font-size:10px; font-weight:800; letter-spacing:1px;
    color:var(--ink-dim); padding:6px 16px; border-radius:20px; cursor:pointer; transition:all 0.15s ease;
  }
  .mode-tab.active{ background:var(--accent); color:#fff; box-shadow:0 0 14px rgba(255,122,61,0.5); }

  .section-label{
    font-family:'Orbitron', sans-serif; font-size:10.5px; letter-spacing:2px;
    color:var(--ink-dim); text-align:left; margin:16px 4px 8px; display:flex; justify-content:space-between;
  }
  .section-label span{ opacity:0.6; font-size:9.5px; }

  .level-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(110px, 1fr)); gap:8px; }
  .level-card{
    position:relative; cursor:pointer; border-radius:12px; padding:10px 6px;
    background:var(--panel-2); border:1.5px solid var(--line); min-height:80px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    transition:transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .level-card.selected{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset, 0 0 18px rgba(255,122,61,0.18); }
  .level-card.locked{ opacity:0.38; filter:grayscale(0.8); cursor:not-allowed; }
  .level-card:not(.locked):hover{ border-color:rgba(255,255,255,0.35); transform:translateY(-2px); }
  .level-card:not(.locked):active{ transform:scale(0.96); }
  .card-num{ font-family:'Orbitron',sans-serif; font-size:9.5px; color:var(--ink-dim); }
  .card-name{ font-size:12px; font-weight:700; color:var(--ink); }
  .card-tagline{ font-size:8.5px; color:var(--ink-dim); font-style:italic; }
  .check-badge{ position:absolute; top:5px; left:6px; font-size:10.5px; font-weight:900; color:var(--accent); }
  .lock-badge{
    display:none; position:absolute; top:5px; right:5px; font-size:8px; letter-spacing:0.5px;
    background:rgba(0,0,0,0.7); color:var(--ink-dim); padding:2px 4px; border-radius:4px;
  }
  .locked .lock-badge{ display:block; }

  /* Bats Collection Grid */
  .bat-filter-bar{ display:flex; gap:6px; margin-bottom:8px; overflow-x:auto; padding-bottom:2px; }
  .bat-filter{
    font-size:9px; font-family:'Orbitron',sans-serif; letter-spacing:1px;
    padding:4px 10px; border-radius:12px; background:rgba(255,255,255,0.05);
    color:var(--ink-dim); cursor:pointer; border:1px solid transparent; white-space:nowrap;
  }
  .bat-filter.active{ background:rgba(255,255,255,0.15); color:var(--ink); border-color:var(--line); }

  .bat-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:8px;
    max-height:270px; overflow-y:auto; padding:4px; -webkit-overflow-scrolling:touch;
  }
  .bat-card{
    position:relative; cursor:pointer; border-radius:12px; padding:10px 8px;
    background:var(--panel-2); border:1.5px solid var(--line); min-height:115px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    transition:transform 0.12s ease, border-color 0.15s ease;
  }
  .bat-card.selected{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset, 0 0 18px rgba(255,122,61,0.2); }
  .bat-card.locked{ opacity:0.4; filter:grayscale(0.8); cursor:not-allowed; }
  .bat-card:not(.locked):hover{ border-color:rgba(255,255,255,0.35); transform:translateY(-2px); }
  .bat-card:not(.locked):active{ transform:scale(0.96); }
  .bat-swatch{ width:26px; height:26px; border-radius:50%; border:2px solid rgba(255,255,255,0.3); margin-bottom:2px; box-shadow:0 2px 8px rgba(0,0,0,0.5); }
  .stat-row{ width:100%; display:flex; align-items:center; gap:5px; }
  .stat-label{ font-size:8px; font-family:'Orbitron',sans-serif; color:var(--ink-dim); width:24px; text-align:left; flex-shrink:0; }
  .stat-bar{ flex:1; height:4px; background:rgba(255,255,255,0.1); border-radius:2px; overflow:hidden; }
  .stat-fill{ height:100%; background:var(--accent); border-radius:2px; }

  .stats-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:8px; margin:14px 0;
  }
  .stat-box{
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:10px;
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .stat-val{ font-family:'Orbitron',sans-serif; font-size:18px; font-weight:800; color:var(--ink); }
  .stat-desc{ font-size:9px; color:var(--ink-dim); letter-spacing:0.5px; text-transform:uppercase; }

  .ready-line{ margin-top:14px; font-size:12px; color:var(--ink-dim); }
  .ready-line b{ color:var(--ink); }

  .unlock-card{
    max-width:280px; margin:10px auto; padding:14px; border-radius:14px;
    background:var(--panel-2); border:1.5px solid var(--accent);
    box-shadow:0 0 24px rgba(255,122,61,0.25);
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .unlock-label{ font-family:'Orbitron',sans-serif; font-size:10px; letter-spacing:2px; color:var(--accent); font-weight:800; }

  .btn{
    font-family:'Orbitron', sans-serif; font-weight:800; font-size:11.5px; letter-spacing:1.5px;
    color:var(--bg); background:var(--ink); border:none; border-radius:999px;
    padding:12px 26px; text-transform:uppercase; cursor:pointer; min-height:44px;
    transition:transform 0.1s ease, filter 0.1s ease, box-shadow 0.15s ease;
  }
  .btn:active{ transform:scale(0.95); filter:brightness(0.9); }
  .btn.primary{ animation:pulseBtn 2.2s ease-in-out infinite; background:linear-gradient(135deg, #ff7a3d, #ea580c); color:#fff; }
  .btn.secondary{ background:transparent; color:var(--ink); border:1px solid var(--line); }
  @keyframes pulseBtn{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,122,61,0.5); }
    50%{ box-shadow:0 0 0 10px rgba(255,122,61,0); }
  }
  .hidden{ display:none !important; }

  @media (max-width:480px){
    #hint{ display:none; }
    #subRow{ font-size:8.5px; padding:3px 8px; }
    #serveBarContainer{ bottom:68px; }
    .serve-tab{ padding:5px 9px; font-size:8.5px; }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div id="scoreboard">
    <div class="score-block player">
      <span class="label">YOU</span>
      <span id="scorePlayer" class="digits">0</span>
    </div>
    <div id="divider">:</div>
    <div class="score-block ai">
      <span id="scoreAI" class="digits">0</span>
      <span class="label">AI</span>
    </div>
  </div>
  <div id="subRow">
    <span id="levelInfo">LVL 1 · Rookie</span>
    <span class="dot">•</span>
    <b id="batInfo">Classic Red</b>
    <span class="dot">•</span>
    <span>SERVE: <span id="serveWho">YOU</span></span>
  </div>
  <div id="rallyBadge">RALLY 0</div>
</div>

<div id="topControls">
  <button id="soundBtn" class="icon-btn" title="Toggle Sound">🔊</button>
  <button id="camBtn" class="icon-btn" title="Switch Camera View">🎥</button>
  <button id="menuBtn" class="icon-btn" title="Menu">☰</button>
</div>

<!-- Extra Service Type Selector Bar -->
<div id="serveBarContainer" class="hidden">
  <div id="servePrompt">CLICK / SWIPE TO SERVE</div>
  <div id="serveBar">
    <button class="serve-tab active" data-servetype="standard" onclick="window.onSelectServeType('standard')">🎯 CLASSIC</button>
    <button class="serve-tab speed" data-servetype="speed" onclick="window.onSelectServeType('speed')">⚡ BULLET FLAT</button>
    <button class="serve-tab side" data-servetype="tomahawk" onclick="window.onSelectServeType('tomahawk')">🌀 TOMAHAWK</button>
    <button class="serve-tab ghost" data-servetype="ghost" onclick="window.onSelectServeType('ghost')">✂️ GHOST CHOP</button>
    <button class="serve-tab" data-servetype="high_toss" onclick="window.onSelectServeType('high_toss')">🚀 SKY TOPSPIN</button>
    <button class="serve-tab" data-servetype="float" onclick="window.onSelectServeType('float')">👻 KNUCKLEBALL</button>
  </div>
</div>

<div id="banner"></div>
<div id="hint">Move forward to counter-attack · Pull back for smash · Use Serve Bar to switch spin styles</div>

<div id="overlay">
  <div id="overlayBody"></div>
  <div id="overlayButtons"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* =====================================================================
   CONSTANTS & PARAMETERS
   ===================================================================== */
var TABLE_LENGTH   = 2.74;
var TABLE_WIDTH    = 1.525;
var TABLE_SURFACE_Y= 0.76;
var TABLE_THICK    = 0.03;
var NET_HEIGHT     = 0.1525;
var NET_THICK      = 0.015;
var BALL_RADIUS    = 0.02;

var GRAVITY        = -9.81;
var REST_TABLE     = 0.865;
var MAGNUS_COEFF_Y = 0.044;
var MAGNUS_COEFF_X = 0.052;

var PLAYER_Z = TABLE_LENGTH/2 + 0.35;
var AI_Z     = -(TABLE_LENGTH/2 + 0.35);

var PADDLE_RADIUS  = 0.092;
var BASE_HIT_RADIUS= 0.34;
var PADDLE_Y_MIN   = TABLE_SURFACE_Y - 0.05;
var PADDLE_Y_MAX   = TABLE_SURFACE_Y + 0.75;
var PADDLE_Y_REST  = TABLE_SURFACE_Y + 0.25;
var PADDLE_X_LIMIT = TABLE_WIDTH/2 + 0.85;

var WIN_SCORE = 11;
var isSmallDevice = Math.min(window.innerWidth, window.innerHeight) < 540;

/* =====================================================================
   EXPANDED 24 PRO BATS ARSENAL & 5 CAREER TIERS
   ===================================================================== */
var LEVELS = [
  { name:'Rookie',      tagline:'Learn the fundamentals', aiSpeed:2.4, aiError:0.045, aiPower:0.95, smashChance:0.02, spinSkill:0.35, color:'#7dd3fc' },
  { name:'Amateur',     tagline:'Fast counters & spin',   aiSpeed:3.0, aiError:0.030, aiPower:1.02, smashChance:0.12, spinSkill:0.65, color:'#4fd1ff' },
  { name:'Club Player', tagline:'Solid tactical rallies', aiSpeed:3.7, aiError:0.018, aiPower:1.08, smashChance:0.24, spinSkill:0.95, color:'#38bdf8' },
  { name:'Pro Master',  tagline:'Precise tournament play', aiSpeed:4.4, aiError:0.008, aiPower:1.15, smashChance:0.40, spinSkill:1.25, color:'#f97316' },
  { name:'Grand Champion', tagline:'Master of the arena', aiSpeed:5.2, aiError:0.000, aiPower:1.22, smashChance:0.55, spinSkill:1.60, color:'#ff7a3d' }
];

var BATS = [
  /* Category: Allround */
  { cat:'allround', name:'Classic Red',       power:1.00, spin:1.00, control:1.00, color:0xe8432c, accent:'#ff7a3d' },
  { cat:'allround', name:'Soft Touch Wood',   power:0.85, spin:0.95, control:1.45, color:0x8b5a2b, accent:'#d4a373' },
  { cat:'allround', name:'Titanium Wall',     power:1.05, spin:1.05, control:1.55, color:0x475569, accent:'#94a3b8' },
  { cat:'allround', name:'Sakura Precision',  power:0.98, spin:1.25, control:1.40, color:0xf472b6, accent:'#fbcfe8' },
  { cat:'allround', name:'Aegis Guardian',    power:1.02, spin:1.15, control:1.50, color:0x0d9488, accent:'#5eead4' },
  { cat:'allround', name:'Carbon Balance',    power:1.12, spin:1.12, control:1.20, color:0x334155, accent:'#cbd5e1' },

/* =====================================================================
   SYNTHESIZER & AUDIO SYSTEM (Low-Latency WebAudio)
   ===================================================================== */
var AudioSys = {
  ctx: null,
  init: function(){
    if(!this.ctx){
      var AudioContext = window.AudioContext || window.webkitAudioContext;
      if(AudioContext) this.ctx = new AudioContext();
    }
    if(this.ctx && this.ctx.state === 'suspended'){
      this.ctx.resume();
    }
  },
  playTone: function(freq, type, duration, vol, slideFreq){
    if(!progress.soundEnabled || !this.ctx) return;
    try {
      var t = this.ctx.currentTime;
      var osc = this.ctx.createOscillator();
      var gain = this.ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t);
      if(slideFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(10, slideFreq), t + duration);
      gain.gain.setValueAtTime(vol || 0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + duration);
    } catch(e){}
  },
  hitPaddle: function(isSmash, isSpin){
    this.init();
    if(isSmash){
      this.playTone(360, 'triangle', 0.20, 0.7, 75);
      this.playTone(150, 'sawtooth', 0.15, 0.5, 30);
    } else if(isSpin){
      this.playTone(590, 'sine', 0.08, 0.32, 380);
    } else {
      this.playTone(480, 'sine', 0.065, 0.3, 260);
    }
  },
  hitTable: function(){
    this.init();
    this.playTone(270, 'triangle', 0.045, 0.25, 150);
  },
  score: function(isPlayer){
    this.init();
    if(isPlayer){
      this.playTone(523.25, 'triangle', 0.09, 0.25);
      setTimeout(function(){ AudioSys.playTone(659.25, 'triangle', 0.14, 0.3); }, 80);
    } else {
      this.playTone(380.00, 'sine', 0.11, 0.22, 250);
    }
  },
  cheer: function(){
    this.init();
    if(!progress.soundEnabled || !this.ctx) return;
    try {
      var bufferSize = Math.floor(this.ctx.sampleRate * 0.35);
      var buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      var output = buffer.getChannelData(0);
      for (var i = 0; i < bufferSize; i++) {
        output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.28));
      }
      var whiteNoise = this.ctx.createBufferSource();
      whiteNoise.buffer = buffer;
      var filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1200;
      var gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.16, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      whiteNoise.start();
    } catch(e){}
  },
  fanfare: function(won){
    this.init();
    if(won){
      var notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach(function(f, idx){
        setTimeout(function(){ AudioSys.playTone(f, 'triangle', 0.22, 0.3); }, idx * 120);
      });
      setTimeout(function(){ AudioSys.cheer(); }, 400);
    } else {
      var notes2 = [380, 330, 280, 200];
      notes2.forEach(function(f, idx){
        setTimeout(function(){ AudioSys.playTone(f, 'sawtooth', 0.20, 0.22, f-35); }, idx * 130);
      });
    }
  }
};

function spawnSparks(x, y, z, colorHex, count, powerMult){
  var mult = powerMult || 1.0;
  var spawned = 0;
  for(var i=0; i<MAX_PARTICLES && spawned < count; i++){
    var p = particles[i];
    if(p.life <= 0){
      p.mesh.position.set(x, y, z);
      p.mesh.material.color.setHex(colorHex || 0xffaa33);
      p.mesh.visible = true;
      p.vx = (Math.random()-0.5)*3.2*mult;
      p.vy = (Math.random()*2.4 + 0.5)*mult;
      p.vz = (Math.random()-0.5)*3.2*mult;
      p.life = (0.24 + Math.random()*0.12);
      p.maxLife = p.life;
      spawned++;
    }
  }
}

  ball.bouncesAI = 0;
  ball.inPlay = false;
  ball.isServe = true;
  landingReticle.visible = false;
  currentRallyCount = 0;
  updateHUD();

  if(currentServer === 'player'){
    gameState = STATE.SERVE_WAIT;
    ball.x = playerPaddle.position.x;
    ball.y = playerPaddle.position.y + 0.02;
    ball.z = playerPaddle.position.z - 0.16;
    ball.lastHitter = 'none';
    ballMesh.position.set(ball.x, ball.y, ball.z);
    updateServeBarUI();
  } else {
    updateServeBarUI();
    gameState = STATE.SERVE_WAIT;
    ball.x = 0;
    ball.y = TABLE_SURFACE_Y + 0.16;
    ball.z = AI_Z + 0.18;
    ball.lastHitter = 'none';
    ballMesh.position.set(ball.x, ball.y, ball.z);
    showBanner('AI SERVING...');
    setTimeout(function(){ if(gameState === STATE.SERVE_WAIT && currentServer === 'ai') executeAIServe(); }, 900);
  }
}

function startMatch(levelIdx){
  progress.selectedLevel = levelIdx;
  saveProgress();
  scorePlayer = 0;
  scoreAI = 0;
  currentServer = 'player';
  totalServes = 0;
  currentRallyCount = 0;
  matchStats = { smashes: 0, maxRally: 0, spinWinners: 0, totalHits: 0 };
  updateHUD();
  updatePlayerPaddleBat();
  resetBallForServe();
  document.getElementById('overlay').classList.add('hidden');
}

function determineNextServer(){
  totalServes++;
  if(scorePlayer >= 10 && scoreAI >= 10){
    currentServer = (currentServer === 'player') ? 'ai' : 'player';
  } else {
    if(totalServes % 2 === 0){
      currentServer = (currentServer === 'player') ? 'ai' : 'player';
    }
  }
}

function endPoint(winner, reason){
  if(gameState === STATE.POINT_SCORED || gameState === STATE.MATCH_OVER) return;
  gameState = STATE.POINT_SCORED;
  updateServeBarUI();
  landingReticle.visible = false;

  if(currentRallyCount >= 8) AudioSys.cheer();

  if(winner === 'player'){
    scorePlayer++;
    AudioSys.score(true);
    showBanner('POINT PLAYER!');
    if(Math.hypot(ball.spinX, ball.spinY) > 12) matchStats.spinWinners++;
  } else {
    scoreAI++;
    AudioSys.score(false);
    showBanner('POINT AI');
  }
  updateHUD();

  var isWin = (scorePlayer >= WIN_SCORE && scorePlayer - scoreAI >= 2);
  var isLoss = (scoreAI >= WIN_SCORE && scoreAI - scorePlayer >= 2);

  if((isWin || isLoss) && progress.gameMode === 'career'){
    gameState = STATE.MATCH_OVER;
    setTimeout(function(){ onMatchFinished(isWin); }, 1100);
  } else {
    determineNextServer();
    updateHUD();
    setTimeout(function(){
      if(gameState !== STATE.MENU){
        resetBallForServe();
      }
    }, 1150);
  }
}

function onMatchFinished(playerWon){
  AudioSys.fanfare(playerWon);
  var newlyUnlockedLevel = -1;
  var newlyUnlockedBat = -1;

  if(playerWon){
    if(progress.selectedLevel < LEVELS.length - 1 && !progress.unlockedLevels[progress.selectedLevel + 1]){
      progress.unlockedLevels[progress.selectedLevel + 1] = true;
      newlyUnlockedLevel = progress.selectedLevel + 1;
    }
    // Unlock new bats per level completed
    var nextBatA = progress.selectedLevel * 4 + 3;
    var nextBatB = progress.selectedLevel * 4 + 4;
    if(nextBatA < BATS.length && !progress.unlockedBats[nextBatA]){
      progress.unlockedBats[nextBatA] = true;
      newlyUnlockedBat = nextBatA;
    } else if(nextBatB < BATS.length && !progress.unlockedBats[nextBatB]){
      progress.unlockedBats[nextBatB] = true;
      newlyUnlockedBat = nextBatB;
    }
    saveProgress();
  }

  showMatchEndOverlay(playerWon, newlyUnlockedLevel, newlyUnlockedBat);
}

/* =====================================================================
   ZERO-ALLOCATION TRAJECTORY SOLVER & RETICLE PREDICTION
   ===================================================================== */
function solveTrajectory(startX, startY, startZ, targetX, targetY, targetZ, desiredFlightTime, minNetClearance){
  var T = Math.max(0.18, desiredFlightTime || 0.38);
  var vz = (targetZ - startZ) / T;
  var vx = (targetX - startX) / T;
  var vy = (targetY - startY - 0.5 * GRAVITY * T * T) / T;

  var tNet = -startZ / vz;
  if(tNet > 0 && tNet < T){
    var yAtNet = startY + vy * tNet + 0.5 * GRAVITY * tNet * tNet;
    var netTop = TABLE_SURFACE_Y + NET_HEIGHT;
    var requiredY = netTop + (minNetClearance || 0.09);

    if(yAtNet < requiredY){
      vy = (requiredY - startY - 0.5 * GRAVITY * tNet * tNet) / tNet;
    }
  }

  landingReticle.position.x = targetX;
  landingReticle.position.z = targetZ;
  landingReticle.material.color.setHex(startZ > 0 ? 0xff7a3d : 0x38bdf8);
  landingReticle.visible = true;

  _trajResult.vx = vx;
  _trajResult.vy = vy;
  _trajResult.vz = vz;
  return _trajResult;
}

/* =====================================================================
   ADVANCED 6-STYLE 2-STAGE SERVE ENGINE
   ===================================================================== */
function calculateServeTrajectory(startX, startY, startZ, bounce1Z, bounce2Z, targetX, powerMult, speedZOverride){
  var dir = Math.sign(bounce1Z - startZ);
  var speedZ = speedZOverride || (dir * 5.8 * (powerMult || 1.0));
  
  var t1 = Math.abs(bounce1Z - startZ) / Math.abs(speedZ);
  var tNetAfter = Math.abs(0 - bounce1Z) / Math.abs(speedZ);
  var t2 = Math.abs(bounce2Z - bounce1Z) / Math.abs(speedZ);
  
  var requiredNetY = TABLE_SURFACE_Y + NET_HEIGHT + 0.10;
  var minVyAfter = (requiredNetY - TABLE_SURFACE_Y - 0.5 * GRAVITY * tNetAfter * tNetAfter) / tNetAfter;
  var vyAfter = Math.max(minVyAfter, -0.5 * GRAVITY * t2);
  
  var vyImpact = -vyAfter / REST_TABLE;
  var vy0 = vyImpact - GRAVITY * t1;
  var vx0 = (targetX - startX) / (t1 + t2);
  
  landingReticle.position.x = targetX;
  landingReticle.position.z = bounce2Z;
  landingReticle.material.color.setHex(startZ > 0 ? 0xff7a3d : 0x38bdf8);
  landingReticle.visible = true;

  _trajResult.vx = vx0;
  _trajResult.vy = vy0;
  _trajResult.vz = speedZ;
  return _trajResult;
}

function executePlayerServe(){
  if(gameState !== STATE.SERVE_WAIT || currentServer !== 'player') return;
  gameState = STATE.RALLY;
  updateServeBarUI();

  ball.inPlay = true;
  ball.isServe = true;
  ball.lastHitter = 'player';
  ball.bouncesPlayer = 0;
  ball.bouncesAI = 0;
  matchStats.totalHits++;

  var bat = BATS[progress.selectedBat];
  var brushUp = playerPaddleVel.y;
  var brushSide = playerPaddleVel.x;

  var bounce1Z = 0.65;
  var bounce2Z = -0.92 - Math.random() * 0.25;
  var targetX = THREE.MathUtils.clamp((playerPaddle.position.x * 0.45) + (brushSide * 0.05), -0.42, 0.42);
  var speedZ = -5.8 * bat.power;

  var serveType = progress.selectedServeType;
  var bannerText = '⚡ SERVE';
  var bannerClass = 'spin';

  if(serveType === 'speed'){
    speedZ = -8.2 * bat.power;
    bounce1Z = 0.75;
    bounce2Z = -1.25;
    ball.spinX = 12 * bat.spin;
    ball.spinY = brushSide * 4 * bat.spin;
    bannerText = '⚡ BULLET FAST SERVE!';
    bannerClass = 'smash';
  } else if(serveType === 'tomahawk'){
    speedZ = -5.5 * bat.power;
    bounce1Z = 0.60;
    bounce2Z = -0.85;
    targetX = THREE.MathUtils.clamp(targetX - 0.25, -TABLE_WIDTH*0.44, TABLE_WIDTH*0.44);
    ball.spinX = 8 * bat.spin;
    ball.spinY = -28 * bat.spin;
    bannerText = '🌀 TOMAHAWK HOOK SERVE!';
  } else if(serveType === 'ghost'){
    speedZ = -4.5 * bat.power;
    bounce1Z = 0.50;
    bounce2Z = -0.65;
    ball.spinX = -32 * bat.spin;
    ball.spinY = brushSide * 6 * bat.spin;
    bannerText = '✂️ GHOST BACKSPIN CHOP!';
  } else if(serveType === 'high_toss'){
    speedZ = -6.4 * bat.power;
    bounce1Z = 0.70;
    bounce2Z = -1.10;
    ball.spinX = 26 * bat.spin;
    ball.spinY = (Math.random() - 0.5) * 10 * bat.spin;
    bannerText = '🚀 SKY HIGH TOPSPIN!';
  } else if(serveType === 'float'){
    speedZ = -5.0 * bat.power;
    bounce1Z = 0.55;
    bounce2Z = -0.80;
    ball.spinX = (Math.random() - 0.5) * 2;
    ball.spinY = (Math.random() - 0.5) * 3;
    bannerText = '👻 KNUCKLEBALL FLOAT!';
  } else {
    // Standard Placement
    ball.spinX = THREE.MathUtils.clamp(brushUp * 10.0, -25, 30) * bat.spin;
    ball.spinY = THREE.MathUtils.clamp(brushSide * 9.0, -25, 25) * bat.spin;
    bannerText = '🎯 CLASSIC SERVE';
  }

  var sol = calculateServeTrajectory(ball.x, ball.y, ball.z, bounce1Z, bounce2Z, targetX, bat.power, speedZ);

  ball.vx = sol.vx;
  ball.vy = sol.vy;
  ball.vz = sol.vz;

  var isHeavySpin = Math.hypot(ball.spinX, ball.spinY) > 8;
  AudioSys.hitPaddle(serveType === 'speed', isHeavySpin);
  spawnSparks(ball.x, ball.y, ball.z, bat.color, 14, bat.power);
  showBanner(bannerText, bannerClass);
}

function executeAIServe(){
  if(gameState !== STATE.SERVE_WAIT || currentServer !== 'ai') return;
  gameState = STATE.RALLY;
  ball.inPlay = true;
  ball.isServe = true;
  ball.lastHitter = 'ai';
  ball.bouncesPlayer = 0;
  ball.bouncesAI = 0;

  var lvl = LEVELS[progress.selectedLevel];
  var bounce1Z = -0.65;
  var bounce2Z = 1.00 + Math.random() * 0.25;
  var targetX = (Math.random() - 0.5) * 0.42;

  // AI selects serve type based on tier
  var aiTypes = ['standard', 'speed', 'tomahawk', 'ghost', 'high_toss'];
  var pickedType = aiTypes[Math.floor(Math.random() * Math.min(aiTypes.length, progress.selectedLevel + 2))];

  var speedZ = 5.8 * lvl.aiPower;
  if(pickedType === 'speed'){
    speedZ = 7.6 * lvl.aiPower;
    bounce1Z = -0.75;
    bounce2Z = 1.25;
    ball.spinX = -12 * lvl.spinSkill;
    ball.spinY = (Math.random() - 0.5) * 5 * lvl.spinSkill;
  } else if(pickedType === 'tomahawk'){
    ball.spinX = -8 * lvl.spinSkill;
    ball.spinY = 22 * lvl.spinSkill;
  } else if(pickedType === 'ghost'){
    ball.spinX = 24 * lvl.spinSkill;
    ball.spinY = (Math.random() - 0.5) * 6 * lvl.spinSkill;
  } else {
    ball.spinX = -(4 + Math.random() * 6) * lvl.spinSkill;
    ball.spinY = (Math.random() - 0.5) * 8 * lvl.spinSkill;
  }

  var sol = calculateServeTrajectory(ball.x, ball.y, ball.z, bounce1Z, bounce2Z, targetX, lvl.aiPower, speedZ);

  ball.vx = sol.vx;
  ball.vy = sol.vy;
  ball.vz = sol.vz;

  AudioSys.hitPaddle(pickedType === 'speed', true);
  spawnSparks(ball.x, ball.y, ball.z, 0x38bdf8, 12, lvl.aiPower);

/* =====================================================================
   HIGH-RESPONSIVENESS INPUT CONTROLS
   ===================================================================== */
var mouseNormX = 0;
var mouseNormY = 0;

function updateInputCoordinates(clientX, clientY){
  if(clientX === undefined || clientY === undefined) return;
  mouseNormX = (clientX / window.innerWidth) * 2 - 1;
  mouseNormY = -(clientY / window.innerHeight) * 2 + 1;

  playerPaddleTarget.x = THREE.MathUtils.clamp(mouseNormX * (TABLE_WIDTH * 0.82), -PADDLE_X_LIMIT, PADDLE_X_LIMIT);

  var clampedY = THREE.MathUtils.clamp(mouseNormY, -1.0, 1.0);
  playerPaddleTarget.z = THREE.MathUtils.lerp(1.70, 0.72, (clampedY + 1.0) * 0.5);
  playerPaddleTarget.y = THREE.MathUtils.clamp(TABLE_SURFACE_Y + 0.18 + (clampedY * 0.35), PADDLE_Y_MIN, PADDLE_Y_MAX);
}

window.addEventListener('pointermove', function(e){
  updateInputCoordinates(e.clientX, e.clientY);
}, { passive: true });

window.addEventListener('touchmove', function(e){
  if(e.touches.length > 0){
    updateInputCoordinates(e.touches[0].clientX, e.touches[0].clientY);
  }
}, { passive: true });

window.addEventListener('pointerdown', function(e){
  if(e.target.closest('#serveBarContainer') || e.target.closest('#topControls') || e.target.closest('#overlay')) return;
  AudioSys.init();
  updateInputCoordinates(e.clientX, e.clientY);
  if(gameState === STATE.SERVE_WAIT && currentServer === 'player'){
    executePlayerServe();
  }
});

window.addEventListener('keydown', function(e){

/* =====================================================================
   120Hz FIXED SUB-STEP PHYSICS ENGINE (NO LAG & NO TUNNELING)
   ===================================================================== */
var physicsAccumulator = 0;
var FIXED_DT = 1 / 120; // 120Hz high fidelity sub-stepping

function stepPhysics(dt){
  var bat = BATS[progress.selectedBat];
  var lvl = LEVELS[progress.selectedLevel];

  // Smooth Player Paddle Motion
  playerPaddleVel.x = (playerPaddleTarget.x - playerPaddlePrev.x) / dt;
  playerPaddleVel.y = (playerPaddleTarget.y - playerPaddlePrev.y) / dt;
  playerPaddlePrev.x = playerPaddleTarget.x;
  playerPaddlePrev.y = playerPaddleTarget.y;

  playerPaddle.position.x += (playerPaddleTarget.x - playerPaddle.position.x) * 0.85;
  playerPaddle.position.y += (playerPaddleTarget.y - playerPaddle.position.y) * 0.85;
  playerPaddle.position.z += (playerPaddleTarget.z - playerPaddle.position.z) * 0.85;
  playerPaddle.rotation.z = -playerPaddleVel.x * 0.038;
  playerPaddle.rotation.x = 0.15 - (playerPaddleVel.y * 0.032);

  if(gameState === STATE.SERVE_WAIT && currentServer === 'player'){
    ball.x = playerPaddle.position.x;
    ball.y = playerPaddle.position.y + 0.02;
    ball.z = playerPaddle.position.z - 0.16;
    ballMesh.position.set(ball.x, ball.y, ball.z);
    ballShadow.visible = true;
    ballShadow.position.set(ball.x, TABLE_SURFACE_Y + 0.002, ball.z);
    return;
  }

  // Predictive AI Paddle Motion
  if(gameState === STATE.RALLY || (gameState === STATE.SERVE_WAIT && currentServer === 'ai')){
    var isIncomingServe = ball.isServe && ball.lastHitter === 'player';
    var aiSpeedMult = isIncomingServe ? Math.max(lvl.aiSpeed, 3.8) : lvl.aiSpeed;
    var errorFactor = isIncomingServe ? (lvl.aiError * 0.05) : lvl.aiError;

    var targetX = ball.x + (Math.sin(Date.now()*0.003) * errorFactor) - (ball.spinY * 0.012);
    var targetY = THREE.MathUtils.clamp(ball.y, TABLE_SURFACE_Y + 0.06, TABLE_SURFACE_Y + 0.42);

    aiPaddleTarget.x += (targetX - aiPaddleTarget.x) * Math.min(1.0, aiSpeedMult * dt * 3.8);
    aiPaddleTarget.y += (targetY - aiPaddleTarget.y) * Math.min(1.0, aiSpeedMult * dt * 3.4);
  } else {
    aiPaddleTarget.x += (0 - aiPaddleTarget.x) * (2.0 * dt);
    aiPaddleTarget.y += (PADDLE_Y_REST - aiPaddleTarget.y) * (2.0 * dt);
  }

  aiPaddleVel.x = (aiPaddleTarget.x - aiPaddlePrev.x) / dt;
  aiPaddleVel.y = (aiPaddleTarget.y - aiPaddlePrev.y) / dt;
  aiPaddlePrev.x = aiPaddleTarget.x;
  aiPaddlePrev.y = aiPaddleTarget.y;

  aiPaddle.position.x = aiPaddleTarget.x;
  aiPaddle.position.y = aiPaddleTarget.y;
  aiPaddle.rotation.z = aiPaddleVel.x * 0.03;
  aiPaddle.rotation.x = -0.15;

  if(gameState !== STATE.RALLY) return;

  // Magnus Aerodynamic Forces
  var magnusY = -ball.spinX * (MAGNUS_COEFF_Y * bat.spin);
  var magnusX = ball.spinY * (MAGNUS_COEFF_X * bat.spin);

  ball.vx += magnusX * dt;
  ball.vy += (GRAVITY + magnusY) * dt;
  ball.vx *= 0.996;
  ball.vz *= 0.996;

  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  ball.z += ball.vz * dt;

  ballMesh.position.set(ball.x, ball.y, ball.z);
  ballMesh.rotation.x += (ball.spinX * 0.35 + ball.vz * 2.0) * dt;
  ballMesh.rotation.y += ball.spinY * 0.45 * dt;

  // Shadow projection
  if(ball.y >= TABLE_SURFACE_Y && Math.abs(ball.x) <= TABLE_WIDTH/2 + 0.25 && Math.abs(ball.z) <= TABLE_LENGTH/2 + 0.25){
    ballShadow.visible = true;
    ballShadow.position.set(ball.x, TABLE_SURFACE_Y + 0.002, ball.z);
    var scale = THREE.MathUtils.clamp(1.0 - (ball.y - TABLE_SURFACE_Y)*1.2, 0.35, 1.0);
    ballShadow.scale.set(scale, scale, 1);
  } else {
    ballShadow.visible = false;
  }

  // Net Collision Check
  if(Math.abs(ball.z) < (NET_THICK/2 + BALL_RADIUS)){
    if(ball.y < TABLE_SURFACE_Y + NET_HEIGHT){
      if(Math.abs(ball.x) < TABLE_WIDTH/2 + 0.08){
        ball.vz = -ball.vz * 0.35;
        ball.vx *= 0.4;
        ball.vy = Math.min(ball.vy, 0.4);
        ball.z = Math.sign(ball.z || -1) * (NET_THICK/2 + BALL_RADIUS + 0.015);
        landingReticle.visible = false;
        spawnSparks(ball.x, ball.y, ball.z, 0xaaaaaa, 4, 0.5);
      }
    }
  }

  // Table Bounce Check
  if(ball.y - BALL_RADIUS <= TABLE_SURFACE_Y && ball.y + BALL_RADIUS >= TABLE_SURFACE_Y - 0.08){
    if(ball.vy < 0 && Math.abs(ball.x) <= TABLE_WIDTH/2 + 0.04 && Math.abs(ball.z) <= TABLE_LENGTH/2 + 0.04){
      ball.y = TABLE_SURFACE_Y + BALL_RADIUS;
      ball.vy = -ball.vy * REST_TABLE;

      ball.vz -= (ball.spinX * 0.03);
      ball.vx += (ball.spinY * 0.04);
      ball.spinX *= 0.65;
      ball.spinY *= 0.65;

      AudioSys.hitTable();
      spawnSparks(ball.x, TABLE_SURFACE_Y, ball.z, 0xffffff, 5, 1.0);

      if(ball.z > 0){
        ball.bouncesPlayer++;
        if(ball.lastHitter === 'player' && ball.bouncesPlayer > 1){
          endPoint('ai', 'Player Net / Serve Fault');
          return;
        }
        if(ball.lastHitter === 'ai' && ball.bouncesPlayer > 1){
          endPoint('ai', 'Player missed return');
          return;
        }
      } else {
        ball.bouncesAI++;
        if(ball.lastHitter === 'ai' && ball.bouncesAI > 1){
          endPoint('player', 'AI Net / Serve Fault');
          return;
        }
        if(ball.lastHitter === 'player' && ball.bouncesAI > 1){
          endPoint('player', 'AI missed return');
          return;
        }
      }

      if(ball.isServe){
        if(ball.lastHitter === 'player' && ball.bouncesAI >= 1){
          ball.isServe = false;
        } else if(ball.lastHitter === 'ai' && ball.bouncesPlayer >= 1){
          ball.isServe = false;
        }
      }
    }
  }

  // Dead-ball check
  var ballSpeed = Math.hypot(ball.vx, ball.vy, ball.vz);
  if(ballSpeed < 0.28 && ball.y <= TABLE_SURFACE_Y + BALL_RADIUS + 0.04 && Math.abs(ball.z) < TABLE_LENGTH/2 + 0.1){
    if(ball.lastHitter === 'ai'){
      if(ball.bouncesPlayer === 0) endPoint('player', 'AI Net Fault');
      else endPoint('ai', 'Dead ball');
    } else if(ball.lastHitter === 'player'){
      if(ball.bouncesAI === 0) endPoint('ai', 'Player Net Fault');
      else endPoint('player', 'Dead ball');
    }
    return;
  }

  // Player Paddle 3D Hit Detection
  var pDistX = ball.x - playerPaddle.position.x;
  var pDistY = ball.y - playerPaddle.position.y;
  var pDistZ = ball.z - playerPaddle.position.z;
  var dist3D = Math.hypot(pDistX, pDistY, pDistZ);

  var effectivePlayerHitRadius = BASE_HIT_RADIUS * (0.85 + 0.3 * bat.control);

  if(dist3D < effectivePlayerHitRadius && ball.vz > 0){
    var swingSpeed = Math.hypot(playerPaddleVel.x, playerPaddleVel.y);
    var isSmash = (ball.y > TABLE_SURFACE_Y + 0.16) && (swingSpeed > 1.2 || playerPaddleVel.y < -0.8);

    var brushY = playerPaddleVel.y;
    var brushX = playerPaddleVel.x;
    ball.spinX = THREE.MathUtils.clamp(brushY * 10.0, -35, 40) * bat.spin;
    ball.spinY = THREE.MathUtils.clamp(brushX * 9.0, -35, 35) * bat.spin;

    var targetZ = isSmash ? -1.22 : (-0.55 - Math.random() * 0.55);
    var aimOffset = (playerPaddle.position.x * 0.65) + (playerPaddleVel.x * 0.08);
    var targetX = THREE.MathUtils.clamp(aimOffset * (1.1 / bat.control), -TABLE_WIDTH*0.44, TABLE_WIDTH*0.44);
    
    var flightTime = isSmash ? (0.22 / bat.power) : (0.36 / bat.power);
    var returnSol = solveTrajectory(ball.x, ball.y, ball.z, targetX, TABLE_SURFACE_Y, targetZ, flightTime, isSmash ? 0.04 : 0.10);

    ball.vx = returnSol.vx;
    ball.vy = returnSol.vy;
    ball.vz = returnSol.vz;

    ball.lastHitter = 'player';
    ball.isServe = false;
    ball.bouncesAI = 0;
    ball.bouncesPlayer = 0;

    currentRallyCount++;
    matchStats.totalHits++;
    if(currentRallyCount > matchStats.maxRally) matchStats.maxRally = currentRallyCount;
    updateHUD();

    var isHeavySpin = Math.hypot(ball.spinX, ball.spinY) > 10;
    AudioSys.hitPaddle(isSmash, isHeavySpin);
    spawnSparks(ball.x, ball.y, ball.z, bat.color, isSmash ? 25 : 10, bat.power);

    if(isSmash){
      matchStats.smashes++;
      showBanner('🔥 ULTRA SMASH!', 'smash');
      triggerScreenShake(0.24);
      triggerSlowMo(0.30);
    } else if(ball.spinX > 14){
      showBanner('⚡ TOPSPIN LOOP', 'spin');
    } else if(ball.spinX < -10){
      showBanner('✂️ BACKSPIN CHOP', 'spin');
    } else if(Math.abs(ball.spinY) > 10){
      showBanner('🌀 CURVE SLICE', 'spin');
    }
  }

  // AI Paddle Return Collision
  var aiDistX = ball.x - aiPaddle.position.x;
  var aiDistY = ball.y - aiPaddle.position.y;
  var aiDistZ = ball.z - aiPaddle.position.z;
  var aiDist3D = Math.hypot(aiDistX, aiDistY, aiDistZ);

  if(aiDist3D < BASE_HIT_RADIUS && ball.vz < 0){
    var aiSmash = (Math.random() < lvl.smashChance) && (ball.y > TABLE_SURFACE_Y + 0.22);
    var aiTargetZ = aiSmash ? 1.25 : (1.00 + Math.random() * 0.25);
    var aiTargetX = THREE.MathUtils.clamp((Math.random() - 0.5) * (TABLE_WIDTH * 0.8), -TABLE_WIDTH*0.42, TABLE_WIDTH*0.42);
    var aiFlightTime = aiSmash ? (0.25 / lvl.aiPower) : (0.38 / lvl.aiPower);

    var aiSol = solveTrajectory(ball.x, ball.y, ball.z, aiTargetX, TABLE_SURFACE_Y, aiTargetZ, aiFlightTime, aiSmash ? 0.04 : 0.10);

    ball.vx = aiSol.vx;
    ball.vy = aiSol.vy;
    ball.vz = aiSol.vz;
    ball.spinX = -(6 + Math.random() * 10) * lvl.spinSkill;
    ball.spinY = (Math.random() - 0.5) * 12 * lvl.spinSkill;

    ball.lastHitter = 'ai';
    ball.isServe = false;
    ball.bouncesPlayer = 0;
    ball.bouncesAI = 0;

    currentRallyCount++;
    if(currentRallyCount > matchStats.maxRally) matchStats.maxRally = currentRallyCount;
    updateHUD();

    AudioSys.hitPaddle(aiSmash, true);
    spawnSparks(ball.x, ball.y, ball.z, 0x38bdf8, 16, lvl.aiPower);
    if(aiSmash){
      showBanner('AI SMASH!', 'smash');
      triggerScreenShake(0.20);
      triggerSlowMo(0.25);
    }
  }

  // Out of bounds / floor check
  if(ball.y < 0.15 || Math.abs(ball.z) > TABLE_LENGTH + 1.2 || Math.abs(ball.x) > TABLE_WIDTH + 1.2){
    if(ball.lastHitter === 'player'){
      if(ball.bouncesAI >= 1) endPoint('player', 'Point Player');
      else endPoint('ai', 'Player shot out');
    } else if(ball.lastHitter === 'ai'){
      if(ball.bouncesPlayer >= 1) endPoint('ai', 'Point AI');
      else endPoint('player', 'AI shot out');
    } else {
      endPoint(currentServer === 'player' ? 'ai' : 'player', 'Fault');
    }
  }
}

/* =====================================================================
   MODALS & UI MENUS
   ===================================================================== */
var overlayEl = document.getElementById('overlay');
var overlayBody = document.getElementById('overlayBody');
var overlayButtons = document.getElementById('overlayButtons');
var activeBatFilter = 'all';

function renderBatCards(){
  var html = '';
  for(var b=0; b<BATS.length; b++){
    var bat = BATS[b];
    if(activeBatFilter !== 'all' && bat.cat !== activeBatFilter) continue;
    var bUnlocked = progress.unlockedBats[b];
    var bSel = (progress.selectedBat === b);
    html += '<div class="bat-card ' + (bSel ? 'selected ' : '') + (!bUnlocked ? 'locked' : '') + '" onclick="window.onSelectBat(' + b + ')">';
    html += '<span class="lock-badge">LOCKED</span>';
    html += '<div class="bat-swatch" style="background:#' + bat.color.toString(16).padStart(6,'0') + '"></div>';
    html += '<div class="card-name">' + bat.name + '</div>';

    html += '<div class="stat-row"><span class="stat-label">PWR</span><div class="stat-bar"><div class="stat-fill" style="width:' + (bat.power/1.65*100) + '%"></div></div></div>';
    html += '<div class="stat-row"><span class="stat-label">SPN</span><div class="stat-bar"><div class="stat-fill" style="width:' + (bat.spin/1.85*100) + '%"></div></div></div>';
    html += '<div class="stat-row"><span class="stat-label">CTL</span><div class="stat-bar"><div class="stat-fill" style="width:' + (bat.control/1.60*100) + '%"></div></div></div>';
    html += '</div>';
  }
  return html;
}

function showMainMenu(){
  gameState = STATE.MENU;
  updateServeBarUI();
  landingReticle.visible = false;
  overlayEl.classList.remove('hidden');

  var html = '<h1>PRO CHAMPIONSHIP <span class="accent">3D</span></h1>';
  html += '<p class="sub">High performance 120Hz physics, 24 elite championship bats, and 6 master serve styles</p>';

  html += '<div class="mode-switch">';
  html += '<div class="mode-tab ' + (progress.gameMode === 'career' ? 'active' : '') + '" onclick="window.onSetGameMode(\'career\')">CAREER CUP</div>';
  html += '<div class="mode-tab ' + (progress.gameMode === 'practice' ? 'active' : '') + '" onclick="window.onSetGameMode(\'practice\')">PRACTICE RALLY</div>';
  html += '</div>';

  if(progress.gameMode === 'career'){
    html += '<div class="section-label">SELECT CAREER TIER <span>' + LEVELS.length + ' TIERS</span></div>';
    html += '<div class="level-grid">';
    for(var i=0; i<LEVELS.length; i++){
      var lvl = LEVELS[i];
      var unlocked = progress.unlockedLevels[i];
      var sel = (progress.selectedLevel === i);
      html += '<div class="level-card ' + (sel ? 'selected ' : '') + (!unlocked ? 'locked' : '') + '" onclick="window.onSelectLevel(' + i + ')">';
      if(unlocked && i < LEVELS.length - 1 && progress.unlockedLevels[i+1]) html += '<span class="check-badge">✓</span>';
      html += '<span class="lock-badge">LOCKED</span>';
      html += '<div class="card-num">TIER ' + (i+1) + '</div>';
      html += '<div class="card-name">' + lvl.name + '</div>';
      html += '<div class="card-tagline">' + lvl.tagline + '</div>';
      html += '</div>';
    }
    html += '</div>';
  }

  html += '<div class="section-label">EQUIP PRO PADDLE <span>' + BATS.length + ' AVAILABLE</span></div>';
  
  html += '<div class="bat-filter-bar">';
  html += '<button class="bat-filter ' + (activeBatFilter === 'all' ? 'active' : '') + '" onclick="window.onFilterBats(\'all\')">ALL (' + BATS.length + ')</button>';
  html += '<button class="bat-filter ' + (activeBatFilter === 'allround' ? 'active' : '') + '" onclick="window.onFilterBats(\'allround\')">CONTROL</button>';
  html += '<button class="bat-filter ' + (activeBatFilter === 'speed' ? 'active' : '') + '" onclick="window.onFilterBats(\'speed\')">SPEED / SMASH</button>';
  html += '<button class="bat-filter ' + (activeBatFilter === 'spin' ? 'active' : '') + '" onclick="window.onFilterBats(\'spin\')">SPIN MASTER</button>';
  html += '<button class="bat-filter ' + (activeBatFilter === 'legendary' ? 'active' : '') + '" onclick="window.onFilterBats(\'legendary\')">LEGENDARY</button>';
  html += '</div>';

  html += '<div class="bat-grid" id="batGridContainer">' + renderBatCards() + '</div>';

  var curLvl = LEVELS[progress.selectedLevel];
  var curBat = BATS[progress.selectedBat];
  html += '<div class="ready-line">Equipped: <b>' + curBat.name + '</b> (' + (progress.gameMode === 'career' ? 'Tier ' + (progress.selectedLevel+1) + ': ' + curLvl.name : 'Practice Mode') + ')</div>';

  overlayBody.innerHTML = html;
  overlayButtons.innerHTML = '<button class="btn primary" onclick="window.onStartGame()">ENTER ARENA</button>';
}

function showMatchEndOverlay(playerWon, newLvl, newBat){
  overlayEl.classList.remove('hidden');
  var html = '<h1>' + (playerWon ? '<span class="accent">CHAMPION!</span>' : 'MATCH DEFEAT') + '</h1>';
  html += '<p class="sub">Final Score: <b>' + scorePlayer + '</b> - <b>' + scoreAI + '</b></p>';

  html += '<div class="stats-grid">';
  html += '<div class="stat-box"><span class="stat-val">' + matchStats.maxRally + '</span><span class="stat-desc">Max Rally</span></div>';
  html += '<div class="stat-box"><span class="stat-val">' + matchStats.smashes + '</span><span class="stat-desc">Ultra Smashes</span></div>';
  html += '<div class="stat-box"><span class="stat-val">' + matchStats.spinWinners + '</span><span class="stat-desc">Spin Winners</span></div>';
  html += '</div>';

  if(playerWon && (newLvl !== -1 || newBat !== -1)){
    html += '<div class="unlock-card">';
    html += '<div class="unlock-label">★ UNLOCKED NEW GEAR ★</div>';
    if(newLvl !== -1) html += '<div style="font-size:13px; font-weight:700;">New Tier: ' + LEVELS[newLvl].name + '</div>';
    if(newBat !== -1) html += '<div style="font-size:13px; font-weight:700; color:' + BATS[newBat].accent + '">New Bat: ' + BATS[newBat].name + '</div>';
    html += '</div>';
  }

  overlayBody.innerHTML = html;
  overlayButtons.innerHTML = '<button class="btn primary" onclick="window.onStartGame()">PLAY AGAIN</button>' +
                             '<button class="btn secondary" onclick="window.onOpenMenu()">CAREER MENU</button>';
}

window.onFilterBats = function(filter){
  activeBatFilter = filter;
  var container = document.getElementById('batGridContainer');
  if(container) container.innerHTML = renderBatCards();
  var btns = document.querySelectorAll('.bat-filter');
  btns.forEach(function(b){
    if(b.innerText.toLowerCase().includes(filter)) b.classList.add('active');
    else b.classList.remove('active');
  });
};

window.onSetGameMode = function(mode){
  progress.gameMode = mode;
  saveProgress();
  showMainMenu();
};

window.onSelectLevel = function(idx){
  if(!progress.unlockedLevels[idx]) return;
  progress.selectedLevel = idx;
  saveProgress();
  showMainMenu();
};

window.onSelectBat = function(idx){
  if(!progress.unlockedBats[idx]) return;
  progress.selectedBat = idx;
  saveProgress();
  updatePlayerPaddleBat();
  showMainMenu();
};

window.onStartGame = function(){
  AudioSys.init();
  startMatch(progress.selectedLevel);
};

window.onOpenMenu = function(){
  AudioSys.init();
  showMainMenu();
};

document.getElementById('menuBtn').addEventListener('click', function(){
  showMainMenu();
});

document.getElementById('soundBtn').addEventListener('click', function(){
  progress.soundEnabled = !progress.soundEnabled;
  this.innerText = progress.soundEnabled ? '🔊' : '🔇';
  saveProgress();
});

document.getElementById('camBtn').addEventListener('click', function(){
  progress.cameraMode = (progress.cameraMode + 1) % 2;
  saveProgress();
});

/* =====================================================================
   MAIN LOOP WITH FIXED-STEP TIME ACCUMULATOR
   ===================================================================== */
var clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  var rawDt = clock.getDelta();
  if(rawDt > 0.1) rawDt = 0.1; // Clamp against frame jumps when tab inactive

  var effectiveDt = rawDt;
  if(slowMoTime > 0){
    slowMoTime -= rawDt;
    effectiveDt = rawDt * 0.35;
  }

  // 120Hz Sub-Stepping Loop
  physicsAccumulator += effectiveDt;
  var steps = 0;
  while(physicsAccumulator >= FIXED_DT && steps < 8){
    stepPhysics(FIXED_DT);
    physicsAccumulator -= FIXED_DT;
    steps++;
  }

  // Update Visual Trails (Buffered)
  if(gameState === STATE.RALLY){
    for(var t = TRAIL_LENGTH - 1; t > 0; t--){
      trailHistory[t].x = trailHistory[t-1].x;
      trailHistory[t].y = trailHistory[t-1].y;
      trailHistory[t].z = trailHistory[t-1].z;
      trailHistory[t].active = trailHistory[t-1].active;
    }
    trailHistory[0].x = ball.x;
    trailHistory[0].y = ball.y;
    trailHistory[0].z = ball.z;
    trailHistory[0].active = true;

    var isSmashShot = Math.abs(ball.vz) > 8.0;
    var trailColor = 0xffffff;
    if(isSmashShot) trailColor = 0xffb020;
    else if(ball.spinX > 8) trailColor = 0xff7a3d;
    else if(ball.spinX < -6) trailColor = 0x38bdf8;
    else if(Math.abs(ball.spinY) > 6) trailColor = 0xa855f7;

    for(var tp=0; tp<TRAIL_LENGTH; tp++){
      if(trailHistory[tp].active){
        trailPoints[tp].position.set(trailHistory[tp].x, trailHistory[tp].y, trailHistory[tp].z);
        trailPoints[tp].material.color.setHex(trailColor);
        trailPoints[tp].visible = true;
      } else {
        trailPoints[tp].visible = false;
      }
    }
  } else {
    for(var i=0; i<TRAIL_LENGTH; i++){
      trailPoints[i].visible = false;
      trailHistory[i].active = false;
    }
  }

  // Camera & Shake
  var targetCamX = 0;
  var targetCamY = TABLE_SURFACE_Y + 0.72;
  var targetCamZ = PLAYER_Z + 1.05;

  if(progress.cameraMode === 1){
    targetCamX = playerPaddle.position.x * 0.45;
    targetCamY = TABLE_SURFACE_Y + 0.58;
    targetCamZ = PLAYER_Z + 0.82;
  }

  if(screenShakeTime > 0){
    screenShakeTime -= rawDt;
    camera.position.x = targetCamX + (Math.random() - 0.5) * 0.04;
    camera.position.y = targetCamY + (Math.random() - 0.5) * 0.04;
    camera.position.z = targetCamZ;
  } else {
    camera.position.x += (targetCamX - camera.position.x) * 0.12;
    camera.position.y += (targetCamY - camera.position.y) * 0.12;
    camera.position.z += (targetCamZ - camera.position.z) * 0.12;
  }
  camera.lookAt(0, TABLE_SURFACE_Y + 0.10, AI_Z * 0.35);

  // Particles Tick
  for(var pi=0; pi<MAX_PARTICLES; pi++){
    var p = particles[pi];
    if(p.life > 0){
      p.life -= rawDt;
      p.mesh.position.x += p.vx * rawDt;
      p.mesh.position.y += p.vy * rawDt;
      p.mesh.position.z += p.vz * rawDt;
      p.vy += GRAVITY * 0.4 * rawDt;
      p.mesh.material.opacity = Math.max(0, p.life / p.maxLife);
      if(p.life <= 0) p.mesh.visible = false;
    }
  }

  renderer.render(scene, camera);
}

// Initial Boot
updatePlayerPaddleBat();
document.getElementById('soundBtn').innerText = progress.soundEnabled ? '🔊' : '🔇';
updateHUD();
showMainMenu();
animate();

})();
